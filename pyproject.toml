[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "citara"
dynamic = ["version"]
description = "Local-first personal knowledge backend for notes, podcast transcripts, embeddings, and citation-backed retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Citara contributors" }]
maintainers = [{ name = "CloudSecMentor", email = "cloudsecmentor+citara@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "mcp>=1.10",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pymupdf>=1.28.0",
]

[project.urls]
Homepage = "https://github.com/cloudsecmentor/citara"
Repository = "https://github.com/cloudsecmentor/citara"
Issues = "https://github.com/cloudsecmentor/citara/issues"
Security = "mailto:cloudsecmentor+citara@gmail.com"

[project.scripts]
citara-mcp = "citara.adapters.mcp.stdio:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "yt-dlp>=2026.7.4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses function calls in argument defaults.
"src/citara/adapters/api/main.py" = ["B008"]
# Scripts and test setup configure sys.path / env vars before imports.
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.hatch.version]
path = "src/citara/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/citara"]
