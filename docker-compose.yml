services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hermes_kv
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_kv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn hermes_knowledge.adapters.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://hermes:hermes@postgres:5432/hermes_kv
      DEFAULT_TENANT_ID: local
      DEFAULT_USER_ID: owner
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: .
    command: hermes-kv-mcp
    environment:
      DATABASE_URL: postgresql+psycopg://hermes:hermes@postgres:5432/hermes_kv
      DEFAULT_TENANT_ID: local
      DEFAULT_USER_ID: owner
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -c "print('worker stub')"
    environment:
      DATABASE_URL: postgresql+psycopg://hermes:hermes@postgres:5432/hermes_kv
      DEFAULT_TENANT_ID: local
      DEFAULT_USER_ID: owner
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: .
    command: python -c "print('frontend stub')"
