services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: citara
      POSTGRES_USER: citara
      POSTGRES_PASSWORD: citara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citara -d citara"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn citara.adapters.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://citara:citara@postgres:5432/citara
      DEFAULT_TENANT_ID: local
      DEFAULT_USER_ID: owner
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: .
    command: citara-mcp
    environment:
      DATABASE_URL: postgresql+psycopg://citara:citara@postgres:5432/citara
      DEFAULT_TENANT_ID: local
      DEFAULT_USER_ID: owner
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -c "print('worker stub')"
    environment:
      DATABASE_URL: postgresql+psycopg://citara:citara@postgres:5432/citara
      DEFAULT_TENANT_ID: local
      DEFAULT_USER_ID: owner
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: .
    command: python -c "print('frontend stub')"

volumes:
  postgres_data:
