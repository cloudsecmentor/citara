[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC

# The runtime URL is read from DATABASE_URL by alembic/env.py.
# This fallback keeps alembic commands usable for local development.
sqlalchemy.url = sqlite:///./hermes_knowledge_vault.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
